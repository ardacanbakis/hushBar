name: hushBar
options:
  bundleIdPrefix: com.ardacanbakis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  hushBar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/hushBar
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HushBar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSMicrophoneUsageDescription: HushBar toggles the system microphone's mute state. It never records or transmits audio.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Support/hushBar.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardacanbakis.hushBar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_VERSION: "5.0"

schemes:
  hushBar:
    build:
      targets:
        hushBar: all
    run:
      config: Debug
    archive:
      config: Release
