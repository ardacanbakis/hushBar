name: muteMe
options:
  bundleIdPrefix: com.ardacanbakis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  muteMe:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/muteMe
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: muteMe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSMicrophoneUsageDescription: muteMe toggles the system microphone's mute state. It never records or transmits audio.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Support/muteMe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardacanbakis.muteMe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_VERSION: "5.0"
