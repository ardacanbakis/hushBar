name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Build and package
        run: bash scripts/build-release.sh
        env:
          SIGN: "0"

      - name: Get version
        id: version
        run: |
          VERSION=$(defaults read "$(pwd)/Support/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "1.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HushBar ${{ steps.version.outputs.version }}"
          files: |
            dist/HushBar-*.zip
            dist/HushBar-*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
